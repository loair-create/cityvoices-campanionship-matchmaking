<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: #111827;
      line-height: 1.5;
      max-width: 720px;
      margin: 0 auto;
      padding: 1.5rem 1.25rem 3rem;
      background: #f9fafb;
    }
    h1 {
      color: #0d9488;
      font-size: 1.75rem;
      margin: 0 0 0.25rem 0;
    }
    .sub {
      color: #6b7280;
      font-size: 0.875rem;
      margin-bottom: 2rem;
    }
    .qa {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 0.5rem;
      overflow: hidden;
    }
    .qa-row {
      padding: 0.875rem 1rem;
      border-bottom: 1px solid #f3f4f6;
    }
    .qa-row:last-child { border-bottom: none; }
    .q {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #6b7280;
      margin-bottom: 0.35rem;
    }
    .a {
      font-size: 0.9375rem;
      color: #111827;
      white-space: pre-wrap;
      word-break: break-word;
    }
    @media print {
      body { background: #fff; }
    }
  </style>
  <title>Public profile</title>
</head>
<body>
  <h1><?= firstName ?></h1>
  <p class="sub">Companionship Connections — shared profile (responses only; no contact information)</p>
  <div class="qa">
    <? for (var i = 0; i < rows.length; i++) { ?>
    <div class="qa-row">
      <div class="q"><?= rows[i].question ?></div>
      <div class="a"><?= rows[i].answer ?></div>
    </div>
    <? } ?>
  </div>
</body>
</html>
