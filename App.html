<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdfa',
              100: '#ccfbf1',
              500: '#14b8a6',
              600: '#0d9488',
              700: '#0f766e',
              900: '#134e4a',
            }
          }
        }
      }
    }
  </script>
  <style>
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; }
    ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
    .loader { border: 4px solid #f3f3f3; border-top: 4px solid #0d9488; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body class="bg-gray-100 h-screen overflow-hidden">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef, useCallback } = React;

    // --- ROBUST ICONS (Embedded SVGs to guarantee rendering) ---
    const IconWrapper = ({ children, className }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        {children}
      </svg>
    );

    const ICONS = {
      Users: (p) => <IconWrapper {...p}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></IconWrapper>,
      Match: (p) => <IconWrapper {...p}><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></IconWrapper>,
      Filter: (p) => <IconWrapper {...p}><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></IconWrapper>,
      Search: (p) => <IconWrapper {...p}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></IconWrapper>,
      Close: (p) => <IconWrapper {...p}><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></IconWrapper>,
      Calendar: (p) => <IconWrapper {...p}><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></IconWrapper>,
      Check: (p) => <IconWrapper {...p}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></IconWrapper>,
      Delete: (p) => <IconWrapper {...p}><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></IconWrapper>,
      Settings: (p) => <IconWrapper {...p}><line x1="4" x2="20" y1="21" y2="21"/><line x1="4" x2="20" y1="3" y2="3"/><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="4" y1="21" y2="14"/><line x1="4" x2="4" y1="10" y2="3"/><line x1="12" x2="12" y1="21" y2="12"/><line x1="12" x2="12" y1="8" y2="3"/><line x1="20" x2="20" y1="21" y2="16"/><line x1="20" x2="20" y1="12" y2="3"/><line x1="1" x2="7" y1="14" y2="14"/><line x1="9" x2="15" y1="8" y2="8"/><line x1="17" x2="23" y1="16" y2="16"/></IconWrapper>,
      BookOpen: (p) => <IconWrapper {...p}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></IconWrapper>,
      BarChart: (p) => <IconWrapper {...p}><line x1="18" x2="18" y1="20" y2="10"/><line x1="12" x2="12" y1="20" y2="4"/><line x1="6" x2="6" y1="20" y2="14"/></IconWrapper>,
      Eye: (p) => <IconWrapper {...p}><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></IconWrapper>,
      Mail: (p) => <IconWrapper {...p}><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></IconWrapper>,
      Edit: (p) => <IconWrapper {...p}><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></IconWrapper>,
      Save: (p) => <IconWrapper {...p}><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></IconWrapper>,
      AlertTriangle: (p) => <IconWrapper {...p}><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></IconWrapper>,
    };

    // --- CONFIG ---
    // Adjusted weights to sum to 100 exactly
    const DEFAULT_CRITERIA_CONFIG = [
      { key: 'borough', label: 'Borough', weight: 15, category: 'Logistics', enabled: true },
      { key: 'willingToTravel', label: 'Willing to Travel', weight: 5, category: 'Logistics', enabled: true },
      { key: 'availability', label: 'Availability', weight: 25, category: 'Logistics', enabled: true },
      { key: 'age', label: 'Age Group', weight: 5, category: 'Identity', enabled: true },
      { key: 'pronouns', label: 'Pronouns', weight: 5, category: 'Identity', enabled: true },
      { key: 'raceEthnicity', label: 'Race/Ethnicity', weight: 5, category: 'Identity', enabled: true },
      { key: 'gender', label: 'Gender', weight: 5, category: 'Identity', enabled: true },
      { key: 'lgbtq', label: 'LGBTQ+ Status', weight: 10, category: 'Identity', enabled: true },
      { key: 'hasExperiencedDV', label: 'DV Survivor', weight: 5, category: 'Lived Experience', enabled: true },
      { key: 'hasBeenIncarcerated', label: 'Incarceration History', weight: 5, category: 'Lived Experience', enabled: true },
      { key: 'hasExperiencedHomelessness', label: 'Homelessness History', weight: 5, category: 'Lived Experience', enabled: true },
      { key: 'receivingMentalHealthServices', label: 'Mental Health Svcs', weight: 5, category: 'Lived Experience', enabled: true },
      { key: 'isVeteran', label: 'Veteran', weight: 5, category: 'Lived Experience', enabled: true },
    ];

    // --- UTILS ---
    const getOverlappingAvailability = (c1, c2) => {
      const days = ['monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday', 'sunday'];
      const overlaps = [];
      days.forEach(day => {
        const s1 = c1.availability[day];
        const s2 = c2.availability[day];
        if (s1 && s2 && s1 !== 'Unavailable' && s2 !== 'Unavailable') {
            overlaps.push(`${day.charAt(0).toUpperCase() + day.slice(1)}`);
        }
      });
      return overlaps;
    };

    const calculateMatchPercentage = (c1, c2, config) => {
      let score = 0;
      let maxScore = 0;
      const reasons = [];
      const configMap = config.reduce((acc, c) => ({...acc, [c.key]: c}), {});

      const addScore = (key, points, reason) => {
        if (configMap[key]?.enabled) {
           score += points;
           reasons.push(reason);
        }
      };

      config.forEach(c => {
        if(c.enabled) maxScore += c.weight;
      });
      
      if (maxScore === 0) return { percent: 0, reasons: [] };

      // 1. Geography
      if (c1.borough === c2.borough) {
        addScore('borough', configMap['borough']?.weight || 15, `Same Borough (${c1.borough})`);
      } else if (c1.willingToTravel === "Yes" || c2.willingToTravel === "Yes") {
        addScore('willingToTravel', configMap['willingToTravel']?.weight || 5, "Willing to travel");
      }

      // 2. Identity
      if (c1.age === c2.age) addScore('age', configMap['age']?.weight || 5, "Same age group");
      if (c1.pronouns === c2.pronouns && c1.pronouns) addScore('pronouns', configMap['pronouns']?.weight || 3, "Same Pronouns");
      if (c1.raceEthnicity === c2.raceEthnicity && c1.raceEthnicity) addScore('raceEthnicity', configMap['raceEthnicity']?.weight || 5, "Same Race/Ethnicity");
      if (c1.gender === c2.gender) addScore('gender', configMap['gender']?.weight || 5, "Gender Match");
      if (c1.lgbtq === "Yes" && c2.lgbtq === "Yes") addScore('lgbtq', configMap['lgbtq']?.weight || 10, "Both LGBTQ+");

      // 3. Lived Experiences
      const experiences = ['hasExperiencedDV', 'hasBeenIncarcerated', 'hasExperiencedHomelessness', 'receivingMentalHealthServices', 'isVeteran'];
      experiences.forEach(key => {
        if (c1[key] === "Yes" && c2[key] === "Yes") {
           addScore(key, configMap[key]?.weight || 8, `Shared: ${configMap[key].label}`);
        }
      });

      // 4. Availability
      if (configMap['availability']?.enabled) {
        const overlaps = getOverlappingAvailability(c1, c2);
        if (overlaps.length > 0) {
            const weight = configMap['availability'].weight || 25;
            const fraction = Math.min(1, overlaps.length / 3); 
            score += weight * fraction;
            reasons.push(`${overlaps.length} overlapping days`);
        }
      }

      const percent = Math.round((score / maxScore) * 100);
      return { percent, reasons };
    };

    /** Dates and timestamps shown in the app use MM/DD/YYYY only. */
    const formatDateMMDD = (raw) => {
      const s = String(raw || '').trim();
      if (!s) return '—';
      const d = new Date(s);
      if (!isNaN(d.getTime())) {
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const dd = String(d.getDate()).padStart(2, '0');
        const yyyy = d.getFullYear();
        return `${mm}/${dd}/${yyyy}`;
      }
      return s;
    };

    const isContactOrSensitivePublicHeader = (header) => {
      const s = String(header || '').toLowerCase();
      if (s.includes('email')) return true;
      if (s.includes('e-mail')) return true;
      if (s.includes('phone')) return true;
      if (s.includes('telephone')) return true;
      if (s.includes('mobile')) return true;
      if (s.includes('cell phone')) return true;
      if (s.includes('last name')) return true;
      if (s.includes('surname')) return true;
      if (s.includes('internal note')) return true;
      if (s.includes('internal status')) return true;
      return false;
    };

    const INTERNAL_STATUS_OPTIONS = ['Active', 'Quit', 'Unresponsive'];

    /** Convert sheet/display MM/DD/YYYY (or parseable date string) to yyyy-MM-dd for HTML date inputs. */
    const lastContactRawToDateInput = (raw) => {
      const s = String(raw || '').trim();
      if (!s) return '';
      const m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
      if (m) {
        const mm = m[1].padStart(2, '0');
        const dd = m[2].padStart(2, '0');
        return `${m[3]}-${mm}-${dd}`;
      }
      const d = new Date(s);
      if (!isNaN(d.getTime())) {
        const y = d.getFullYear();
        const mo = String(d.getMonth() + 1).padStart(2, '0');
        const da = String(d.getDate()).padStart(2, '0');
        return `${y}-${mo}-${da}`;
      }
      return '';
    };

    const dateInputToMMDD = (iso) => {
      if (!iso || String(iso).length < 10) return '';
      const y = iso.slice(0, 4);
      const mo = iso.slice(5, 7);
      const da = iso.slice(8, 10);
      return `${mo}/${da}/${y}`;
    };

    const LAST_CONTACT_STALE_AFTER_DAYS = 14;

    /** True when last contact exists and is strictly more than 14 days before today (local date). */
    const isLastContactOverTwoWeeksOld = (raw) => {
      const s = String(raw || '').trim();
      if (!s) return false;
      const m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
      let contactDay;
      if (m) {
        contactDay = new Date(parseInt(m[3], 10), parseInt(m[1], 10) - 1, parseInt(m[2], 10));
      } else {
        contactDay = new Date(s);
      }
      if (isNaN(contactDay.getTime())) return false;
      contactDay.setHours(0, 0, 0, 0);
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const diffDays = (today.getTime() - contactDay.getTime()) / 86400000;
      return diffDays > LAST_CONTACT_STALE_AFTER_DAYS;
    };

    const DEFAULT_VISIBILITY_SETTINGS = {
      directory: {
        volunteerBadge: true,
        contactEmailPhone: true,
        publicShareHint: true,
        shareActions: true,
        allSignUpQA: true,
        restrictDirectoryColumns: false,
        includedDirectoryQuestionHeaders: [],
        quickSummary: true,
        livedExperienceTags: true,
        availabilityGrid: true,
        internalNotes: true
      },
      matchPicker: {
        matchPercent: true,
        matchReasons: true
      },
      public: {
        showLastName: false,
        showFormResponses: true,
        restrictQuestions: false,
        includedQuestionHeaders: []
      }
    };

    /** "Volunteer" only when they are a volunteer; otherwise empty (no label). */
    const volunteerBadgeOnly = (raw) => {
      const s = String(raw || '').trim();
      if (!s) return '';
      const t = s.toLowerCase();
      if (t === 'yes' || t === 'volunteer' || (t.includes('volunteer') && !t.includes('not volunteer'))) {
        return 'Volunteer';
      }
      return '';
    };

    const mergeSurveyCompareRows = (c1, c2) => {
      const m1 = new Map((c1.allQuestions || []).map(x => [x.question, x.answer]));
      const m2 = new Map((c2.allQuestions || []).map(x => [x.question, x.answer]));
      const order = [];
      const seen = new Set();
      (c1.allQuestions || []).forEach(x => {
        if (!seen.has(x.question)) { seen.add(x.question); order.push(x.question); }
      });
      (c2.allQuestions || []).forEach(x => {
        if (!seen.has(x.question)) { seen.add(x.question); order.push(x.question); }
      });
      const norm = (s) => String(s || '').trim().toLowerCase();
      return order.map(q => {
        const a1 = m1.get(q) ?? '';
        const a2 = m2.get(q) ?? '';
        const same = norm(a1) !== '' && norm(a1) === norm(a2);
        return { question: q, a1, a2, same };
      });
    };

    // --- COMPONENTS ---

    const DetailRow = ({ label, value, highlight }) => (
      <div className={`py-2 border-b border-gray-100 ${highlight ? 'bg-yellow-50 -mx-2 px-2 rounded' : ''}`}>
        <dt className="text-xs font-bold uppercase text-gray-500">{label}</dt>
        <dd className="mt-1 text-sm text-gray-900 break-words">{value || "N/A"}</dd>
      </div>
    );

    const BreakdownMiniTable = ({ title, rows, maxRows = 14 }) => (
      <div className="bg-white rounded-lg border border-gray-200 shadow-sm p-4 h-full min-w-0">
        <h3 className="text-sm font-bold text-gray-800 mb-3 border-b border-gray-100 pb-2 break-words">{title}</h3>
        <div className="space-y-1 max-h-64 overflow-y-auto overflow-x-hidden text-sm">
          {(rows || []).slice(0, maxRows).map((r, i) => (
            <div key={i} className="flex justify-between gap-2 py-1 border-b border-gray-50 last:border-0 min-w-0">
              <span className="text-gray-600 truncate min-w-0 flex-1 pr-1" title={r.label}>{r.label}</span>
              <span className="font-semibold text-brand-800 flex-shrink-0 tabular-nums">{r.count}</span>
            </div>
          ))}
          {(!rows || rows.length === 0) && <p className="text-gray-400 text-xs">No data</p>}
        </div>
      </div>
    );

    const SignUpAllQA = ({ companion, directoryFilter }) => {
      const rows = useMemo(() => {
        const all =
          companion && companion.allQuestions && companion.allQuestions.length > 0 ? companion.allQuestions : [];
        if (!directoryFilter || !directoryFilter.restrictDirectoryColumns) return all;
        const inc = directoryFilter.includedDirectoryQuestionHeaders || [];
        if (inc.length === 0) return [];
        const set = new Set(inc.map((h) => String(h).trim()));
        return all.filter((r) => set.has(String(r.question || '').trim()));
      }, [companion, directoryFilter]);

      const emptyHint =
        directoryFilter &&
        directoryFilter.restrictDirectoryColumns &&
        (directoryFilter.includedDirectoryQuestionHeaders || []).length === 0
          ? 'No columns selected. Open Display settings and choose columns for the directory profile, or turn off “Only show selected sign-up columns.”'
          : null;

      return (
        <div className="min-w-0">
          <h4 className="font-bold text-gray-900 uppercase text-xs tracking-wider border-b pb-2 mb-3">All sign-up questions &amp; responses</h4>
          <div className="max-h-[min(60vh,520px)] overflow-y-auto overflow-x-hidden border border-gray-200 rounded-lg bg-white divide-y divide-gray-100">
            {rows.map((row, i) => (
              <div key={i} className="p-3 hover:bg-gray-50/80 min-w-0">
                <dt className="text-xs font-bold text-gray-500 break-words">{row.question}</dt>
                <dd className="text-sm text-gray-900 mt-1 whitespace-pre-wrap break-words">{String(row.answer || '').trim() ? row.answer : '—'}</dd>
              </div>
            ))}
            {rows.length === 0 && (
              <p className="p-4 text-gray-500 text-sm break-words">
                {emptyHint ||
                  'No form columns loaded. Redeploy the latest script so each row includes allQuestions.'}
              </p>
            )}
          </div>
        </div>
      );
    };

    const ExternalSurveyInsightsBlock = ({ title, sheetData }) => {
      const d = sheetData;
      if (!d || !d.exists) {
        return (
          <div className="border border-dashed border-amber-200 bg-amber-50/40 rounded-lg p-5 text-sm text-amber-900">
            <h3 className="font-bold text-gray-900 mb-1">{title}</h3>
            <p>Could not find a sheet tab named <strong>{d && d.sheetName ? d.sheetName : title}</strong>. Add that tab to this spreadsheet to see results here.</p>
          </div>
        );
      }
      if (d.totalRows === 0) {
        return (
          <div className="border border-gray-200 rounded-lg p-5 text-sm text-gray-600">
            <h3 className="font-bold text-gray-900 mb-1">{title}</h3>
            <p>Sheet exists but has no data rows yet (only a header row or empty).</p>
          </div>
        );
      }
      return (
        <div>
          <h3 className="text-lg font-bold text-gray-900 mb-1">{title}</h3>
          <p className="text-sm text-gray-600 mb-4">{d.totalRows} response{d.totalRows === 1 ? '' : 's'} · frequency by answer (top values per question)</p>
          <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
            {(d.columns || []).map((col, i) => (
              <BreakdownMiniTable key={i} title={col.header} rows={col.breakdown} maxRows={18} />
            ))}
          </div>
        </div>
      );
    };

    const AvailabilityGrid = ({ availability }) => {
      const days = ['monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday', 'sunday'];
      return (
        <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 text-xs min-w-0">
          {days.map(day => {
            const status = availability[day];
            const isUnavailable = status === 'Unavailable';
            const isFlexible = status === 'Flexible';
            const dayTitle = day.charAt(0).toUpperCase() + day.slice(1);
            return (
              <div key={day} className={`p-2 rounded border min-w-0 ${
                isUnavailable ? 'bg-gray-50 border-gray-200 text-gray-400' :
                isFlexible ? 'bg-green-50 border-green-200 text-green-700 font-medium' :
                'bg-blue-50 border-blue-200 text-blue-700'
              }`}>
                <div className="font-semibold mb-1 whitespace-nowrap">{dayTitle}</div>
                <div className="break-words leading-snug text-[11px] sm:text-xs">{status}</div>
              </div>
            );
          })}
        </div>
      );
    };

    const CriteriaSettings = ({ config, onUpdate, onSave }) => {
      // Calculate total enabled weight
      const totalWeight = config
        .filter(c => c.enabled)
        .reduce((sum, item) => sum + (parseInt(item.weight) || 0), 0);
      
      const isValid = totalWeight === 100;

      return (
        <div className="p-8 max-w-5xl mx-auto">
          {/* Header & Actions */}
          <div className="flex justify-between items-start mb-6">
             <div>
                <h2 className="text-2xl font-bold text-gray-800">Matching Criteria Configuration</h2>
                <p className="text-gray-500">
                    Total Active Weight: <span className={`font-bold text-lg ${isValid ? 'text-green-600' : 'text-red-600'}`}>{totalWeight}%</span>
                    <span className="text-xs ml-2 text-gray-400">(Must equal 100%)</span>
                </p>
             </div>
             
             <button
               onClick={onSave}
               disabled={!isValid}
               className={`flex items-center px-6 py-2 rounded-md font-bold text-white shadow-sm transition ${
                 isValid 
                  ? 'bg-brand-600 hover:bg-brand-700 cursor-pointer' 
                  : 'bg-gray-300 cursor-not-allowed'
               }`}
             >
               <ICONS.Save className="w-5 h-5 mr-2" />
               Save Configuration
             </button>
          </div>

          {/* Validation Alert */}
          {!isValid && (
            <div className="mb-6 bg-red-50 border-l-4 border-red-500 p-4 rounded-r shadow-sm animate-pulse">
                <div className="flex items-center">
                    <div className="flex-shrink-0">
                        <ICONS.AlertTriangle className="h-6 w-6 text-red-500" />
                    </div>
                    <div className="ml-3">
                        <p className="text-sm text-red-700 font-bold">
                            Configuration Error: Weights do not add up to 100!
                        </p>
                        <p className="text-xs text-red-600 mt-1">
                            The sum of all ENABLED criteria weights is currently {totalWeight}. You must adjust the weights or enable/disable items until the total equals 100 before saving.
                        </p>
                    </div>
                </div>
            </div>
          )}

          <div className="bg-white rounded-lg shadow border border-gray-200 overflow-x-auto overflow-y-hidden">
             <table className="min-w-full divide-y divide-gray-200">
                <thead className="bg-gray-50">
                   <tr>
                      <th className="px-6 py-3 text-center text-xs font-bold text-gray-500 uppercase w-24">Enabled</th>
                      <th className="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase">Category</th>
                      <th className="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase">Field Name</th>

    const VisibilitySettingsPanel = ({ value, formHeaders, onChange, onSave }) => {
      const dir = value.directory;
      const mp = value.matchPicker;
      const pub = value.public;
      const safeHeaders = (formHeaders || []).filter((h) => {
        const t = String(h || '').trim().toLowerCase();
        return t && t !== 'first name' && !isContactOrSensitivePublicHeader(h);
      });

      const setDir = (key, checked) => {
        onChange({ ...value, directory: { ...dir, [key]: checked } });
      };
      const setMp = (key, checked) => {
        onChange({ ...value, matchPicker: { ...mp, [key]: checked } });
      };
      const setPub = (patch) => {
        onChange({ ...value, public: { ...pub, ...patch } });
      };

      const togglePublicHeader = (h) => {
        const cur = pub.includedQuestionHeaders || [];
        const next = cur.includes(h) ? cur.filter((x) => x !== h) : [...cur, h];
        setPub({ includedQuestionHeaders: next });
      };

      const checkRow = (label, checked, onCheck, hint) => (
        <label className="flex items-start gap-3 py-2 cursor-pointer select-none min-w-0">
          <input
            type="checkbox"
            className="h-5 w-5 mt-0.5 text-brand-600 focus:ring-brand-500 border-gray-300 rounded shrink-0"
            checked={!!checked}
            onChange={(e) => onCheck(e.target.checked)}
          />
          <span className="min-w-0">
            <span className="text-sm font-medium text-gray-900 block break-words">{label}</span>
            {hint ? <span className="text-xs text-gray-500 block mt-0.5 break-words">{hint}</span> : null}
          </span>
        </label>
      );

      return (
        <div className="p-8 max-w-4xl mx-auto space-y-8 pb-16">
          <div className="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-4">
            <div>
              <h2 className="text-2xl font-bold text-gray-800">Display &amp; sharing</h2>
              <p className="text-gray-500 text-sm mt-1 max-w-xl">
                Control what appears in the directory profile pop-up, the Find Match picker, and the public profile link/PDF. Contact and internal fields are never shown on the public page.
              </p>
            </div>
            <button
              type="button"
              onClick={onSave}
              className="flex items-center px-6 py-2 rounded-md font-bold text-white shadow-sm bg-brand-600 hover:bg-brand-700"
            >
              <ICONS.Save className="w-5 h-5 mr-2" />
              Save display settings
            </button>
          </div>

          <div className="bg-white rounded-lg shadow border border-gray-200 p-6">
            <h3 className="text-lg font-bold text-gray-900 mb-1">Directory profile (pop-up)</h3>
            <p className="text-xs text-gray-500 mb-4">When you open someone from the directory.</p>
            <div className="divide-y divide-gray-100">
              {checkRow('Volunteer badge (in title)', dir.volunteerBadge, (v) => setDir('volunteerBadge', v))}
              {checkRow('Email & phone (under name)', dir.contactEmailPhone, (v) => setDir('contactEmailPhone', v))}
              {checkRow('Note about PDF / public link', dir.publicShareHint, (v) => setDir('publicShareHint', v))}
              {checkRow('Download PDF, copy link, open public page', dir.shareActions, (v) => setDir('shareActions', v))}
              {checkRow('All sign-up questions & responses', dir.allSignUpQA, (v) => setDir('allSignUpQA', v))}
              {checkRow('Quick summary (enrollment, internal status, borough)', dir.quickSummary, (v) => setDir('quickSummary', v))}
              {checkRow('Lived experience tags', dir.livedExperienceTags, (v) => setDir('livedExperienceTags', v))}
              {checkRow('Availability grid', dir.availabilityGrid, (v) => setDir('availabilityGrid', v))}
              {checkRow('Internal notes (editable)', dir.internalNotes, (v) => setDir('internalNotes', v))}
              {checkRow(
                'Only show selected sign-up columns on directory profile',
                dir.restrictDirectoryColumns,
                (v) => onChange({ ...value, directory: { ...dir, restrictDirectoryColumns: v } }),
                'Pick exact sheet columns below. Requires “All sign-up questions & responses” above to be on.'
              )}
            </div>
            {dir.restrictDirectoryColumns && (
              <div className="mt-4 border border-gray-200 rounded-lg p-3 bg-gray-50 max-h-72 overflow-y-auto overflow-x-hidden">
                <p className="text-xs font-bold text-gray-600 uppercase mb-2">Columns on directory profile</p>
                <p className="text-xs text-gray-500 mb-2 break-words">Every header from your sign-up sheet. Check the ones to show when the option above is on.</p>
                {(formHeaders || []).length === 0 ? (
                  <p className="text-sm text-gray-500">No columns loaded yet. Reload the app after the script has access to the sheet.</p>
                ) : (
                  (formHeaders || []).map((h) => (
                    <label key={h} className="flex items-start gap-2 py-1.5 text-sm cursor-pointer min-w-0">
                      <input
                        type="checkbox"
                        className="h-4 w-4 mt-0.5 text-brand-600 rounded border-gray-300 shrink-0"
                        checked={(dir.includedDirectoryQuestionHeaders || []).includes(h)}
                        onChange={() => {
                          const cur = dir.includedDirectoryQuestionHeaders || [];
                          const next = cur.includes(h) ? cur.filter((x) => x !== h) : [...cur, h];
                          onChange({ ...value, directory: { ...dir, includedDirectoryQuestionHeaders: next } });
                        }}
                      />
                      <span className="text-gray-800 break-words min-w-0">{h}</span>
                    </label>
                  ))
                )}
              </div>
            )}
          </div>

          <div className="bg-white rounded-lg shadow border border-gray-200 p-6">
            <h3 className="text-lg font-bold text-gray-900 mb-1">Find Match (pop-up)</h3>
            <p className="text-xs text-gray-500 mb-4">Candidate rows when matching from a profile.</p>
            <div className="divide-y divide-gray-100">
              {checkRow('Match % (guide)', mp.matchPercent, (v) => setMp('matchPercent', v))}
              {checkRow('Match reason chips', mp.matchReasons, (v) => setMp('matchReasons', v))}
            </div>
          </div>

          <div className="bg-white rounded-lg shadow border border-gray-200 p-6">
            <h3 className="text-lg font-bold text-gray-900 mb-1">Public profile link &amp; PDF</h3>
            <p className="text-xs text-gray-500 mb-4">What people see at the shared URL or in the downloaded PDF.</p>
            <div className="divide-y divide-gray-100">
              {checkRow('Include last name in the public title', pub.showLastName, (v) => setPub({ showLastName: v }), 'Off = first name only (recommended).')}
              {checkRow('Show sign-up responses', pub.showFormResponses, (v) => setPub({ showFormResponses: v }), 'Off = name only, no Q&A list.')}
              {checkRow('Limit to selected questions only', pub.restrictQuestions, (v) => setPub({ restrictQuestions: v }), 'When on, only checked questions appear (after removing contact/internal fields).')}
            </div>
            {pub.restrictQuestions && (
              <div className="mt-4 border border-gray-200 rounded-lg p-3 bg-gray-50 max-h-72 overflow-y-auto overflow-x-hidden">
                <p className="text-xs font-bold text-gray-600 uppercase mb-2">Questions on public page</p>
                {safeHeaders.length === 0 ? (
                  <p className="text-sm text-gray-500">No columns loaded. Open the app once with data or check the sheet tab name.</p>
                ) : (
                  safeHeaders.map((h) => (
                    <label key={h} className="flex items-start gap-2 py-1.5 text-sm cursor-pointer min-w-0">
                      <input
                        type="checkbox"
                        className="h-4 w-4 mt-0.5 text-brand-600 rounded border-gray-300 shrink-0"
                        checked={(pub.includedQuestionHeaders || []).includes(h)}
                        onChange={() => togglePublicHeader(h)}
                      />
                      <span className="text-gray-800 break-words min-w-0">{h}</span>
                    </label>
                  ))
                )}
              </div>
            )}
          </div>
        </div>
      );
    };

    const MatchComparison = ({ c1, c2, config }) => {
      const { percent, reasons } = calculateMatchPercentage(c1, c2, config);
      const overlaps = getOverlappingAvailability(c1, c2);
      const qaRows = mergeSurveyCompareRows(c1, c2);
      const inCommon = qaRows.filter(r => r.same);
      const i1 = (c1.firstName && c1.firstName[0]) ? c1.firstName[0] : '?';
      const i2 = (c2.firstName && c2.firstName[0]) ? c2.firstName[0] : '?';

      return (
        <div className="space-y-6 min-w-0">
           <div className="flex flex-col sm:flex-row flex-wrap items-center justify-center sm:justify-between gap-6 bg-gradient-to-r from-brand-50 to-white p-4 sm:p-6 rounded-xl border border-brand-100 shadow-sm w-full min-w-0">
              <div className="flex flex-col items-center min-w-0 max-w-full">
                 <div className="h-16 w-16 bg-brand-100 rounded-full flex items-center justify-center text-brand-700 font-bold text-2xl mb-2 border-4 border-white shadow-sm shrink-0">{i1}</div>
                 <div className="font-bold text-gray-900 text-center break-words px-1">{c1.firstName}</div>
                 {volunteerBadgeOnly(c1.volunteer) ? <span className="text-[10px] font-bold uppercase mt-1 text-teal-800 bg-teal-100 px-2 py-0.5 rounded">Volunteer</span> : null}
              </div>
              <div className="flex flex-col items-center flex-1 min-w-0 px-2 sm:px-6 max-w-full">
                 <div className="text-4xl sm:text-5xl font-black text-brand-600 tracking-tighter">{percent}%</div>
                 <div className="text-xs uppercase tracking-widest font-bold text-brand-400 mt-1 text-center">Match score</div>
                 {reasons.length > 0 && (
                   <div className="mt-2 flex flex-wrap justify-center gap-1 max-w-full">
                     {reasons.map((r, i) => <span key={i} className="text-[10px] bg-white/80 border border-brand-100 px-2 py-0.5 rounded text-brand-800 max-w-full break-words text-center">{r}</span>)}
                   </div>
                 )}
              </div>
              <div className="flex flex-col items-center min-w-0 max-w-full">
                 <div className="h-16 w-16 bg-purple-100 rounded-full flex items-center justify-center text-purple-700 font-bold text-2xl mb-2 border-4 border-white shadow-sm shrink-0">{i2}</div>
                 <div className="font-bold text-gray-900 text-center break-words px-1">{c2.firstName}</div>
                 {volunteerBadgeOnly(c2.volunteer) ? <span className="text-[10px] font-bold uppercase mt-1 text-teal-800 bg-teal-100 px-2 py-0.5 rounded">Volunteer</span> : null}
              </div>
           </div>

           <div className="bg-emerald-50 border border-emerald-200 rounded-xl p-4">
              <h3 className="text-sm font-bold text-emerald-900 uppercase tracking-wide mb-2">What they have in common</h3>
              {inCommon.length === 0 ? (
                <p className="text-sm text-emerald-800/80">No identical answers on shared sign-up questions (or answers are blank).</p>
              ) : (
                <ul className="space-y-2 max-h-40 overflow-y-auto text-sm">
                  {inCommon.map((r, i) => (
                    <li key={i} className="border-b border-emerald-100/80 pb-2 last:border-0">
                      <span className="font-semibold text-emerald-950 block">{r.question}</span>
                      <span className="text-emerald-900 whitespace-pre-wrap break-words">{r.a1}</span>
                    </li>
                  ))}
                </ul>
              )}
           </div>

           <div className="bg-white rounded-lg border border-gray-200 p-4">
              <h4 className="font-bold text-gray-700 text-sm uppercase tracking-wider mb-3">Availability overlap</h4>
              <div className="flex flex-wrap gap-2">
                 {overlaps.length > 0 ? overlaps.map(d => (
                    <span key={d} className="px-3 py-1 bg-green-100 text-green-800 text-xs rounded-full font-bold border border-green-200">{d}</span>
                 )) : <span className="text-gray-500 text-sm">No overlapping available days.</span>}
              </div>
           </div>

           <div>
              <h3 className="flex items-center text-lg font-bold text-gray-900 mb-2">
                 <ICONS.BookOpen className="w-5 h-5 mr-2 text-brand-600" />
                 All sign-up questions &amp; responses
              </h3>
              <p className="text-xs text-gray-500 mb-3">Green rows = same non-empty answer. Scroll for full form.</p>
              <div className="border border-gray-200 rounded-lg overflow-hidden max-h-[min(55vh,480px)] overflow-y-auto">
                 <div className="grid grid-cols-12 gap-0 bg-gray-100 text-xs font-bold text-gray-600 uppercase px-2 py-2 border-b border-gray-200 sticky top-0 z-10">
                    <div className="col-span-12 sm:col-span-4 px-2">Question</div>
                    <div className="col-span-6 sm:col-span-4 px-2 border-t sm:border-t-0 border-gray-200 sm:border-l pt-2 sm:pt-0">{c1.firstName}</div>
                    <div className="col-span-6 sm:col-span-4 px-2 border-t sm:border-t-0 border-gray-200 sm:border-l pt-2 sm:pt-0">{c2.firstName}</div>
                 </div>
                 {qaRows.map((r, i) => (
                    <div key={i} className={`grid grid-cols-12 gap-0 border-b border-gray-100 text-sm px-2 py-2 ${r.same ? 'bg-green-50' : 'bg-white hover:bg-gray-50/80'}`}>
                       <div className="col-span-12 sm:col-span-4 font-medium text-gray-600 text-xs sm:text-sm pr-2">{r.question}</div>
                       <div className={`col-span-6 sm:col-span-4 whitespace-pre-wrap break-words border-t sm:border-t-0 border-gray-100 sm:border-l pl-0 sm:pl-2 pt-2 sm:pt-0 ${r.same ? 'font-semibold text-green-900' : 'text-gray-900'}`}>{r.a1 || '—'}</div>
                       <div className={`col-span-6 sm:col-span-4 whitespace-pre-wrap break-words border-t sm:border-t-0 border-gray-100 sm:border-l pl-0 sm:pl-2 pt-2 sm:pt-0 ${r.same ? 'font-semibold text-green-900' : 'text-gray-900'}`}>{r.a2 || '—'}</div>
                    </div>
                 ))}
                 {qaRows.length === 0 && (
                    <p className="p-4 text-gray-500 text-sm">No allQuestions data. Save &amp; reload after updating the Apps Script backend.</p>
                 )}
              </div>
           </div>
        </div>
      );
    };

    const MATCH_STATUS_OPTIONS = [
      'Just Matched',
      'Introduction Sent',
      'First Meeting Set',
      'Active',
      'Canceled'
    ];

    const ActiveMatches = ({ matches, companions, onUpdateStatus, onDeleteMatch, onUpdateNotes, onBulkDeleteComplete, onBulkStatusComplete, config }) => {
      const [viewMatch, setViewMatch] = useState(null);
      const [selectedIds, setSelectedIds] = useState([]);
      const [bulkStatus, setBulkStatus] = useState('Active');
      const [bulkBusy, setBulkBusy] = useState(false);

      const selectedSet = useMemo(() => new Set(selectedIds.map(String)), [selectedIds]);

      const toggleSelected = (id) => {
        const s = String(id);
        setSelectedIds((prev) => (prev.includes(s) ? prev.filter((x) => x !== s) : [...prev, s]));
      };

      if (matches.length === 0) return <div className="p-8 text-center text-gray-500">No active matches yet.</div>;

      const listable = matches.filter((match) => {
        const c1 = companions.find((c) => String(c.id) === String(match.companion1Id));
        const c2 = companions.find((c) => String(c.id) === String(match.companion2Id));
        return !!(c1 && c2);
      });
      const listableIds = listable.map((m) => String(m.id));

      const allListableSelected = listableIds.length > 0 && listableIds.every((id) => selectedSet.has(id));

      const selectAllListable = () => {
        if (allListableSelected) setSelectedIds([]);
        else setSelectedIds([...listableIds]);
      };

      const runBulkDelete = () => {
        if (selectedIds.length === 0) return;
        if (!window.confirm(`Delete ${selectedIds.length} match(es)? This cannot be undone.`)) return;
        setBulkBusy(true);
        const ids = [...selectedIds];
        google.script.run
          .withSuccessHandler(() => {
            setBulkBusy(false);
            onBulkDeleteComplete && onBulkDeleteComplete(ids);
            setSelectedIds([]);
            setViewMatch((vm) => {
              if (!vm || !vm.matchId) return vm;
              return ids.includes(String(vm.matchId)) ? null : vm;
            });
          })
          .withFailureHandler((e) => {
            setBulkBusy(false);
            alert(e.message || String(e));
          })
          .deleteMatchesBatch(ids);
      };

      const runBulkStatus = () => {
        if (selectedIds.length === 0) return;
        if (!window.confirm(`Set status to “${bulkStatus}” for ${selectedIds.length} match(es)?`)) return;
        setBulkBusy(true);
        const ids = [...selectedIds];
        const st = bulkStatus;
        google.script.run
          .withSuccessHandler(() => {
            setBulkBusy(false);
            onBulkStatusComplete && onBulkStatusComplete(ids, st);
          })
          .withFailureHandler((e) => {
            setBulkBusy(false);
            alert(e.message || String(e));
          })
          .updateMatchesStatusBatch(ids, st);
      };

      return (
        <div className="p-8">
           <div className="flex flex-col lg:flex-row lg:items-end lg:justify-between gap-4 mb-6 min-w-0">
              <h1 className="text-2xl font-bold text-gray-900 break-words">Active Companions</h1>
              <div className="flex flex-wrap items-center gap-2 min-w-0">
                 <button
                    type="button"
                    disabled={bulkBusy || listableIds.length === 0}
                    onClick={selectAllListable}
                    className="text-sm px-3 py-2 rounded-md border border-gray-300 bg-white hover:bg-gray-50 disabled:opacity-50"
                 >{allListableSelected ? 'Clear selection' : 'Select all'}</button>
                 <span className="text-sm text-gray-600 px-2">{selectedIds.length} selected</span>
                 <select
                    value={bulkStatus}
                    onChange={(e) => setBulkStatus(e.target.value)}
                    disabled={bulkBusy}
                    className="text-sm border border-gray-300 rounded-md px-2 py-2 bg-white disabled:opacity-50"
                 >
                    {MATCH_STATUS_OPTIONS.map((opt) => (
                       <option key={opt} value={opt}>{opt}</option>
                    ))}
                 </select>
                 <button
                    type="button"
                    disabled={bulkBusy || selectedIds.length === 0}
                    onClick={runBulkStatus}
                    className="text-sm px-4 py-2 rounded-md bg-brand-600 text-white font-medium hover:bg-brand-700 disabled:opacity-50 disabled:pointer-events-none"
                 >Apply status</button>
                 <button
                    type="button"
                    disabled={bulkBusy || selectedIds.length === 0}
                    onClick={runBulkDelete}
                    className="text-sm px-4 py-2 rounded-md bg-red-600 text-white font-medium hover:bg-red-700 disabled:opacity-50 disabled:pointer-events-none"
                 >Delete selected</button>
              </div>
           </div>
           <div className="grid grid-cols-1 gap-6">
             {matches.map(match => {
                const c1 = companions.find(c => String(c.id) === String(match.companion1Id));
                const c2 = companions.find(c => String(c.id) === String(match.companion2Id));
                if (!c1 || !c2) return null;

                const { percent, reasons } = calculateMatchPercentage(c1, c2, config);
                const isSel = selectedSet.has(String(match.id));

                return (
                   <div key={match.id} className={`bg-white rounded-lg shadow-sm border overflow-hidden hover:shadow-md transition ${isSel ? 'border-brand-400 ring-1 ring-brand-200' : 'border-gray-200'}`}>
                      {/* Match Header */}
                      <div 
                         onClick={() => setViewMatch({ c1, c2, matchId: match.id })}
                         className="p-6 cursor-pointer border-b border-gray-100 flex items-center justify-between bg-gradient-to-r from-white to-gray-50 group"
                      >
                         <div className="flex items-center space-x-6">
                            <div className="flex items-center -space-x-3">
                               <div className="h-12 w-12 rounded-full bg-brand-100 flex items-center justify-center text-brand-600 font-bold text-lg ring-4 ring-white z-10">{(c1.firstName && c1.firstName[0]) ? c1.firstName[0] : '?'}</div>
                               <div className="h-12 w-12 rounded-full bg-purple-100 flex items-center justify-center text-purple-600 font-bold text-lg ring-4 ring-white z-0">{(c2.firstName && c2.firstName[0]) ? c2.firstName[0] : '?'}</div>
                            </div>
                            <div>
                               <h3 className="text-lg font-bold text-gray-900 group-hover:text-brand-600 transition">{c1.firstName} & {c2.firstName}</h3>
                               <div className="flex flex-wrap gap-2 mt-1">
                                  <span className={`inline-flex items-center px-2 py-0.5 rounded text-xs font-bold ${percent > 75 ? 'bg-green-100 text-green-800' : 'bg-gray-100 text-gray-800'}`}>
                                     {percent}% Match
                                  </span>
                                  {reasons.slice(0, 2).map((r, i) => (
                                     <span key={i} className="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-gray-100 text-gray-600">{r}</span>
                                  ))}
                               </div>
                               {(volunteerBadgeOnly(c1.volunteer) || volunteerBadgeOnly(c2.volunteer)) && (
                                  <div className="flex flex-wrap gap-1.5 mt-2">
                                     {volunteerBadgeOnly(c1.volunteer) && <span className="text-[10px] font-bold uppercase px-2 py-0.5 rounded bg-teal-100 text-teal-800 border border-teal-200">{c1.firstName}: Volunteer</span>}
                                     {volunteerBadgeOnly(c2.volunteer) && <span className="text-[10px] font-bold uppercase px-2 py-0.5 rounded bg-teal-100 text-teal-800 border border-teal-200">{c2.firstName}: Volunteer</span>}
                                  </div>
                               )}
                            </div>
                         </div>
                         <div className="text-gray-300 group-hover:text-brand-500 transition-colors">
                            <ICONS.BookOpen className="w-6 h-6" />
                         </div>
                      </div>

                      {/* Match Actions */}
                      <div className="bg-gray-50 px-6 py-4 flex items-center justify-between gap-3 min-w-0">
                          <div className="flex items-center space-x-3 w-full min-w-0 mr-2 flex-wrap sm:flex-nowrap">
                             <input
                                type="checkbox"
                                className="h-5 w-5 rounded border-gray-300 text-brand-600 focus:ring-brand-500 flex-shrink-0"
                                checked={isSel}
                                onChange={() => toggleSelected(match.id)}
                                aria-label={`Select match ${c1.firstName} and ${c2.firstName}`}
                             />
                             <div className="relative inline-block text-left">
                                <select 
                                   value={match.status || 'Just Matched'} 
                                   onChange={(e) => {

      const handleSaveVisibilitySettings = () => {
        google.script.run
          .withSuccessHandler(() => alert('Display settings saved.'))

          .saveVisibilitySettings(JSON.stringify(visibilitySettings));
      };

      const togglePendingMatchTarget = useCallback((targetId) => {
         const id = String(targetId);
         setPendingMatchTargetIds((prev) =>
            prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id]
         );
      }, []);

      const handleCreateMatchesFinal = useCallback(() => {
         if (saveMatchInFlight.current || pendingMatchTargetIds.length === 0) return;
         const c1 = selectedCompanion;
         if (!c1) return;

         const baseTime = Date.now();
         const matchObjs = [];
         for (let idx = 0; idx < pendingMatchTargetIds.length; idx++) {
            const targetId = pendingMatchTargetIds[idx];
            const c2 = companions.find((c) => String(c.id) === String(targetId));
            if (!c2) continue;
            matchObjs.push({
               id: 'm-' + baseTime.toString(36) + '-' + idx + '-' + c1.id + '-' + c2.id,
               companion1Id: String(c1.id),
               companion2Id: String(c2.id),
               c1Name: `${c1.firstName} ${c1.lastName}`,
               c2Name: `${c2.firstName} ${c2.lastName}`,
               status: 'Just Matched',
               notes: '',
               createdAt: new Date().toISOString()
            });
         }
         if (matchObjs.length === 0) return;

         const ok = window.confirm(
            `Create ${matchObjs.length} match(es) for ${c1.firstName} ${c1.lastName} with the selected people?`
         );
         if (!ok) return;

         saveMatchInFlight.current = true;
         setSavingMatch(true);
         google.script.run
            .withSuccessHandler((result) => {
               saveMatchInFlight.current = false;
               setSavingMatch(false);
               const created = result && result.created ? result.created : [];
               const skipped = result && typeof result.skipped === 'number' ? result.skipped : 0;
               if (created.length === 0) {
                  alert(
                     skipped
                        ? 'No new matches were saved (those pairs may already exist).'
                        : 'No matches were saved.'
                  );
                  return;
               }
               setMatches((prev) => [...created, ...prev]);
               setPendingMatchTargetIds([]);
               setIsMatchMode(false);
               setSelectedCompanion(null);
               setActiveTab('matches');
               if (skipped > 0) {
                  alert(
                     `${created.length} match(es) created. ${skipped} skipped (duplicate or invalid).`
                  );
               }
            })
            .withFailureHandler((err) => {
               saveMatchInFlight.current = false;
               setSavingMatch(false);
               alert('Failed to save matches: ' + (err && err.message ? err.message : String(err)));
            })
            .createMatchesBatch(matchObjs);
      }, [selectedCompanion, companions, pendingMatchTargetIds]);

      const downloadPublicProfilePdf = useCallback(() => {
         const id = selectedCompanion && selectedCompanion.id;
         if (!id) return;
         google.script.run
            .withSuccessHandler((res) => {
               if (!res || !res.base64) {
                  alert('Could not create PDF.');
                  return;
               }
               const a = document.createElement('a');
               a.href = 'data:application/pdf;base64,' + res.base64;
               a.download = (res && res.fileName) ? res.fileName : 'profile.pdf';
               document.body.appendChild(a);
               a.click();
               document.body.removeChild(a);
            })
            .withFailureHandler((e) => alert(e.message || String(e)))
            .getProfilePdfBase64(String(id));
      }, [selectedCompanion]);

      const copyPublicProfileLink = useCallback(() => {
         const id = selectedCompanion && selectedCompanion.id;
         if (!id) return;
         google.script.run
            .withSuccessHandler((res) => {
               if (!res || !res.ok || !res.url) {
                  alert((res && res.message) || 'Could not build the public link.');
                  return;
               }
               const url = res.url;
               if (navigator.clipboard && window.isSecureContext) {
                  navigator.clipboard.writeText(url).then(() => {
                     alert('Public link copied. It shows first name and form responses only (no contact info).');
                  }).catch(() => {
                     window.prompt('Copy this link:', url);
                  });
               } else {
                  window.prompt('Copy this link:', url);

            .withFailureHandler((e) => alert(e.message || String(e)))
            .getPublicShareLink(String(id));
      }, [selectedCompanion]);

      const openPublicProfilePage = useCallback(() => {
         const id = selectedCompanion && selectedCompanion.id;
         if (!id) return;
         google.script.run
            .withSuccessHandler((res) => {
               if (res && res.ok && res.url) {
                  window.open(res.url, '_blank', 'noopener,noreferrer');
               } else {
                  alert((res && res.message) || 'Could not open the public page.');
               }
            })
            .withFailureHandler((e) => alert(e.message || String(e)))
            .getPublicShareLink(String(id));
      }, [selectedCompanion]);

      const filteredCompanions = useMemo(() => {
        return companions.filter(c => {
          const searchMatch = !search || 
            c.firstName.toLowerCase().includes(search.toLowerCase()) || 
            c.lastName.toLowerCase().includes(search.toLowerCase());
          if (!searchMatch) return false;
          
          for (const key in filters) {
             const filterVal = filters[key];
             const companionVal = c[key];
             if (filterVal && String(companionVal).trim() !== String(filterVal).trim()) return false;
          }
          return true;
        });
      }, [companions, search, filters]);

      /** Companion appears in at least one non-canceled match. */
      const idsWithActiveMatch = useMemo(() => {
        const s = new Set();
        matches.forEach(m => {
          if (String(m.status || '').trim() === 'Canceled') return;
          s.add(String(m.companion1Id));
          s.add(String(m.companion2Id));
        });
        return s;
      }, [matches]);

      /** Everyone except the selected person; optional name filter; sorted by match % (reference only). */
      const findMatchCandidates = useMemo(() => {
        if (!selectedCompanion) return [];
        const q = matchPickerQuery.trim().toLowerCase();
        return companions
          .filter(c => c.id !== selectedCompanion.id)
          .filter(c => {
            if (!q) return true;
            const name = `${c.firstName || ''} ${c.lastName || ''}`.toLowerCase();
            return name.includes(q);
          })
          .map(c => {
            const { percent, reasons } = calculateMatchPercentage(selectedCompanion, c, config);
            return { c, percent, reasons };

          .sort((a, b) => b.percent - a.percent);

               <h1 className="text-xl font-bold">Companionship Connections</h1>

             <nav className="flex-1 px-4 py-6 space-y-2">
                <button type="button" onClick={() => setActiveTab('dashboard')} className={`w-full flex items-center px-4 py-3 rounded-md transition ${activeTab === 'dashboard' ? 'bg-brand-800 shadow-md' : 'hover:bg-brand-800 hover:bg-opacity-50 text-brand-100'}`}>
                   <ICONS.Users className="w-5 h-5 mr-3" /> Directory

                <button type="button" onClick={() => setActiveTab('matches')} className={`w-full flex items-center px-4 py-3 rounded-md transition ${activeTab === 'matches' ? 'bg-brand-800 shadow-md' : 'hover:bg-brand-800 hover:bg-opacity-50 text-brand-100'}`}>

                </button>
                <button type="button" onClick={() => setActiveTab('insights')} className={`w-full flex items-center px-4 py-3 rounded-md transition ${activeTab === 'insights' ? 'bg-brand-800 shadow-md' : 'hover:bg-brand-800 hover:bg-opacity-50 text-brand-100'}`}>
                   <ICONS.BarChart className="w-5 h-5 mr-3" /> Insights
                </button>
                <button type="button" onClick={() => setActiveTab('reminders')} className={`w-full flex items-center px-4 py-3 rounded-md transition ${activeTab === 'reminders' ? 'bg-brand-800 shadow-md' : 'hover:bg-brand-800 hover:bg-opacity-50 text-brand-100'}`}>
                   <ICONS.Mail className="w-5 h-5 mr-3" /> Reminders
                </button>
                <button type="button" onClick={() => setActiveTab('settings')} className={`w-full flex items-center px-4 py-3 rounded-md transition ${activeTab === 'settings' ? 'bg-brand-800 shadow-md' : 'hover:bg-brand-800 hover:bg-opacity-50 text-brand-100'}`}>
                   <ICONS.Settings className="w-5 h-5 mr-3" /> Criteria
                </button>
                <button type="button" onClick={() => setActiveTab('display')} className={`w-full flex items-center px-4 py-3 rounded-md transition ${activeTab === 'display' ? 'bg-brand-800 shadow-md' : 'hover:bg-brand-800 hover:bg-opacity-50 text-brand-100'}`}>
                   <ICONS.Eye className="w-5 h-5 mr-3" /> Display
                </button>
             </nav>
          </aside>

          <main className="flex-1 flex flex-col h-full overflow-hidden relative bg-gray-50">
             {activeTab === 'insights' && (
                <div className="overflow-auto h-full bg-gray-50">
                   <InsightsPanel />
                </div>
             )}
             {activeTab === 'reminders' && (
                <div className="overflow-auto h-full bg-gray-50">
                   <SixMonthRemindersPanel />
                </div>
             )}
             {activeTab === 'settings' && (
                <div className="overflow-auto h-full">
                   <CriteriaSettings 
                      config={config} 
                      onUpdate={handleConfigUpdate} 
                      onSave={handleSaveConfig} 
                   />
                </div>
             )}
             {activeTab === 'display' && (
                <div className="overflow-auto h-full bg-gray-50">
                   <VisibilitySettingsPanel
                      value={visibilitySettings}
                      formHeaders={formHeadersForVisibility}
                      onChange={setVisibilitySettings}
                      onSave={handleSaveVisibilitySettings}
                   />
                </div>
             )}
             {activeTab === 'matches' && (
                <div className="overflow-auto h-full">
                    <ActiveMatches 
                       matches={matches} 
                       companions={companions} 
                       config={config}
                       onUpdateStatus={(id, s) => {
                          setMatches(m => m.map(x => x.id === id ? {...x, status: s} : x));
                          google.script.run.updateMatchData(id, 'status', s);
                       }}
                       onUpdateNotes={(id, n) => {
                          setMatches(m => m.map(x => x.id === id ? {...x, notes: n} : x));
                          google.script.run.updateMatchData(id, 'notes', n);
                       }}
                       onDeleteMatch={(id) => {
                          if(confirm('Delete match?')) {
                             setMatches(m => m.filter(x => x.id !== id));
                             google.script.run.deleteMatch(id);
                          }

                       onBulkDeleteComplete={(ids) => {
                          const idSet = new Set(ids.map(String));
                          setMatches((m) => m.filter((x) => !idSet.has(String(x.id))));
                       }}
                       onBulkStatusComplete={(ids, status) => {
                          const idSet = new Set(ids.map(String));
                          setMatches((m) => m.map((x) => (idSet.has(String(x.id)) ? { ...x, status } : x)));
                       }}

                </div>

                          <button onClick={() => setShowFilters(!showFilters)} className={`flex items-center px-3 py-2 rounded-md border text-sm font-medium transition ${showFilters ? 'bg-brand-50 border-brand-200 text-brand-700' : 'bg-white border-gray-300 text-gray-600 hover:bg-gray-50'}`}>

                                      <div className="flex flex-wrap gap-1.5">

                                            {intStatus === '—' ? 'No internal status' : intStatus}
                                         </span>
                                         {hasActiveMatch ? (
                                            <span className="text-[10px] font-bold uppercase tracking-wide px-2 py-0.5 rounded bg-emerald-100 text-emerald-800">Matched</span>
                                         ) : (
                                            <span className="text-[10px] font-bold uppercase tracking-wide px-2 py-0.5 rounded bg-orange-100 text-orange-900">Needs match</span>
                                         )}
                                         {contactStale ? (
                                            <span className="text-[10px] font-bold uppercase tracking-wide px-2 py-0.5 rounded bg-red-100 text-red-800 border border-red-200" title="Last contact over 2 weeks ago">
                                               Contact due
                                            </span>
                                         ) : null}
                                      </div>
                                   </div>
                                </div>
                                <div className="px-5 py-3 bg-gray-50 border-t border-gray-100 flex justify-between items-center gap-3 min-w-0">
                                   <span className="text-xs font-medium text-gray-500 bg-white px-2 py-1 rounded border border-gray-200 shrink-0">{c.age || '—'}</span>
                                   <span className="text-xs text-brand-600 font-medium group-hover:underline truncate min-w-0 text-right">View Profile &rarr;</span>
                                </div>
                             </div>
                             );
                          })}
                       </div>
                    </div>
                </div>
             )}
          </main>

          {/* Modal Overlay */}
          {selectedCompanion && (() => {
             const dVis = visibilitySettings.directory;
             const mpVis = visibilitySettings.matchPicker;
             const lastContactStale = isLastContactOverTwoWeeksOld(selectedCompanion.lastContactDate);
             return (
             <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
                <div className="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity" onClick={() => {setSelectedCompanion(null); setIsMatchMode(false); setPendingMatchTargetIds([]); setMatchPickerQuery('');}}></div>
                <div className="bg-white rounded-lg text-left shadow-xl w-full max-w-5xl max-h-[90vh] flex flex-col min-h-0 relative z-10">
                   <div className="flex-1 min-h-0 overflow-y-auto overscroll-contain px-4 pt-5 pb-4 sm:p-6 sm:pb-5">
                      <div className="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-3 mb-6 border-b border-gray-100 pb-4 min-w-0">
                         <div className="min-w-0 flex-1 pr-1">
                            <h3 className="text-xl leading-6 font-bold text-gray-900 flex flex-wrap items-center gap-2">
                               {selectedCompanion.firstName} {selectedCompanion.lastName}
                               {dVis.volunteerBadge && volunteerBadgeOnly(selectedCompanion.volunteer) ? (
                                  <span className="text-[10px] font-bold uppercase px-2 py-1 rounded bg-teal-100 text-teal-800">Volunteer</span>
                               ) : null}
                            </h3>
                            {dVis.contactEmailPhone ? (
                               <p className="text-sm text-gray-500 mt-1">{selectedCompanion.email} • {selectedCompanion.phone}</p>
                            ) : null}
                            {dVis.publicShareHint ? (
                               <p className="text-[11px] text-gray-400 mt-2 max-w-xl">
                                  PDF &amp; public link follow your <strong>Display</strong> settings (first/last name and which questions are shared). Contact-related columns are never public.
                               </p>
                            ) : null}
                         </div>
                         <div className="flex flex-wrap items-center gap-2 flex-shrink-0 sm:max-w-[50%] lg:max-w-none">
                            {dVis.shareActions ? (
                               <>
                                  <button
                                     type="button"
                                     onClick={downloadPublicProfilePdf}
                                     className="px-3 py-2 rounded-md border border-gray-300 bg-white text-sm font-medium text-gray-800 hover:bg-gray-50"
                                  >Download PDF</button>
                                  <button
                                     type="button"
                                     onClick={copyPublicProfileLink}
                                     className="px-3 py-2 rounded-md border border-brand-200 bg-brand-50 text-sm font-medium text-brand-800 hover:bg-brand-100"
                                  >Copy public link</button>
                                  <button
                                     type="button"
                                     onClick={openPublicProfilePage}
                                     className="px-3 py-2 rounded-md text-sm font-medium text-brand-700 hover:underline"
                                  >Open public page</button>
                               </>
                            ) : null}
                            <button 
                               type="button"
                               onClick={() => {setSelectedCompanion(null); setIsMatchMode(false); setPendingMatchTargetIds([]); setMatchPickerQuery('');}} 
                               className="bg-red-500 hover:bg-red-600 text-white rounded-md p-2 transition"
                               aria-label="Close"
                            >
                               <ICONS.Close className="w-5 h-5"/>
                            </button>
                         </div>
                      </div>
                      
                      {!isMatchMode ? (
                         <div className="grid grid-cols-1 lg:grid-cols-3 gap-8 items-start min-w-0">
                            <div className="lg:col-span-2 space-y-6 min-w-0">
                               {dVis.allSignUpQA ? (
                                  <SignUpAllQA companion={selectedCompanion} directoryFilter={dVis} />
                               ) : (
                                  <p className="text-sm text-gray-500 border border-dashed border-gray-200 rounded-lg p-6 text-center">Sign-up Q&amp;A is hidden (Display settings).</p>
                               )}
                            </div>
                            <div className="space-y-6 min-w-0">
                               <button type="button" onClick={() => { setPendingMatchTargetIds([]); setMatchPickerQuery(''); setIsMatchMode(true); }} className="w-full bg-brand-600 text-white py-3 rounded-lg shadow hover:bg-brand-700 font-bold flex items-center justify-center">
                                  <ICONS.Match className="w-5 h-5 mr-2"/> Find Match
                               </button>
                               <div className="rounded-lg border border-amber-200 bg-amber-50/50 p-4 space-y-4">
                                  <div>
                                     <label htmlFor={`internal-status-${selectedCompanion.id}`} className="text-xs font-bold text-amber-900 uppercase tracking-wide block mb-1.5">Internal status</label>
                                     <select
                                        id={`internal-status-${selectedCompanion.id}`}
                                        className="w-full max-w-full box-border text-sm border border-amber-300 rounded-md px-3 py-2 bg-white focus:ring-2 focus:ring-brand-500 focus:border-brand-500"
                                        value={(() => {
                                          const s = String(selectedCompanion.internalStatus || '').trim();
                                          if (!s) return '';
                                          if (INTERNAL_STATUS_OPTIONS.includes(s)) return s;
                                          return s;
                                        })()}
                                        onChange={(e) => {
                                          const v = e.target.value;
                                          const id = selectedCompanion.id;
                                          google.script.run
                                            .withFailureHandler((err) => alert(err.message || String(err)))
                                            .updateCompanionInternalStatus(id, v);
                                          setCompanions((prev) =>
                                            prev.map((c) => (String(c.id) === String(id) ? { ...c, internalStatus: v } : c))
                                          );
                                          setSelectedCompanion((prev) =>
                                            prev && String(prev.id) === String(id) ? { ...prev, internalStatus: v } : prev
                                          );
                                        }}
                                     >
                                        <option value="">— None / clear —</option>
                                        {INTERNAL_STATUS_OPTIONS.map((opt) => (
                                          <option key={opt} value={opt}>{opt}</option>
                                        ))}
                                        {(() => {
                                          const s = String(selectedCompanion.internalStatus || '').trim();
                                          if (s && !INTERNAL_STATUS_OPTIONS.includes(s)) {
                                            return (

                                     {selectedCompanion.hasBeenIncarcerated === 'Yes' && <span className="px-2 py-1 bg-orange-100 text-orange-800 text-xs rounded">Incarcerated</span>}
                                     {selectedCompanion.hasExperiencedHomelessness === 'Yes' && <span className="px-2 py-1 bg-yellow-100 text-yellow-800 text-xs rounded">Homelessness</span>}
                                     {selectedCompanion.receivingMentalHealthServices === 'Yes' && <span className="px-2 py-1 bg-purple-100 text-purple-800 text-xs rounded">Mental Health Svcs</span>}
                                     {selectedCompanion.receivingSubstanceUseServices === 'Yes' && <span className="px-2 py-1 bg-blue-100 text-blue-800 text-xs rounded">Substance Use Svcs</span>}
                                  </div>
                               </div>
                               ) : null}
                               {dVis.availabilityGrid ? (
                               <div>
                                  <h4 className="font-bold text-gray-900 uppercase text-xs tracking-wider mb-2 border-b pb-1">Availability</h4>
                                  <AvailabilityGrid availability={selectedCompanion.availability} />
                               </div>
                               ) : null}
                               {dVis.internalNotes ? (
                               <div className="bg-yellow-50 p-4 rounded border border-yellow-100">
                                   <label className="text-xs font-bold text-yellow-800 uppercase block mb-1">Internal notes</label>
                                   <textarea 
                                     className="w-full text-sm p-2 rounded border border-yellow-300"
                                     defaultValue={selectedCompanion.internalNotes}
                                     onBlur={(e) => google.script.run.updateCompanionNote(selectedCompanion.id, e.target.value)}
                                   ></textarea>
                               </div>
                               ) : null}
                            </div>
                         </div>
                      ) : (
                         <div className="space-y-4 flex flex-col min-h-0 flex-1">
                            <button type="button" onClick={() => { setPendingMatchTargetIds([]); setMatchPickerQuery(''); setIsMatchMode(false); }} className="text-sm text-brand-600 hover:underline mb-2 self-start">&larr; Back to Details</button>
                            <p className="text-sm text-gray-600 bg-blue-50 border border-blue-100 rounded-lg px-3 py-2">
                               <strong>Everyone</strong> in the directory is listed (not only high criteria scores). The percentage is a <strong>guide only</strong>—you can match with <strong>any number</strong> of people: tap <strong>Add</strong> for each, then <strong>Create matches</strong>.
                            </p>
                            <div className="relative">
                               <ICONS.Search className="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400 w-4 h-4 pointer-events-none" />
                               <input
                                  type="text"
                                  className="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg text-sm focus:ring-brand-500 focus:border-brand-500"
                                  placeholder="Filter by name (optional)…"
                                  value={matchPickerQuery}
                                  onChange={e => setMatchPickerQuery(e.target.value)}
                               />
                            </div>
                            <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 p-4 bg-gray-50 border border-gray-200 rounded-lg flex-shrink-0">
                               <p className="text-sm text-gray-700">
                                  <span className="font-bold text-gray-900">{pendingMatchTargetIds.length}</span>
                                  {pendingMatchTargetIds.length === 1 ? ' person selected' : ' people selected'}
                                  {pendingMatchTargetIds.length === 0 && <span className="text-gray-500"> — use Add next to each name, then press Create matches.</span>}
                               </p>
                               <button
                                  type="button"
                                  disabled={savingMatch || pendingMatchTargetIds.length === 0}
                                  onClick={handleCreateMatchesFinal}
                                  className="bg-brand-600 text-white px-5 py-2.5 rounded-lg text-sm font-bold hover:bg-brand-700 disabled:opacity-50 disabled:pointer-events-none whitespace-nowrap shadow-sm"
                               >{savingMatch ? 'Saving…' : 'Create matches'}</button>
                            </div>
                            <p className="text-xs text-gray-500">
                               {findMatchCandidates.length} shown
                               {(mpVis.matchPercent || mpVis.matchReasons) ? ' · sorted by match % (highest first)' : ''}
                            </p>
                            <div className="space-y-3 overflow-y-auto flex-1 min-h-0">
                               {findMatchCandidates.map(({ c, percent, reasons }) => {
                                  const isPending = pendingMatchTargetIds.includes(String(c.id));
                                  return (
                                  <div key={c.id} className="border rounded-lg p-4 flex justify-between items-start sm:items-center hover:bg-gray-50 gap-3 min-w-0">
                                     <div className="min-w-0 flex-1">
                                         <div className="flex items-center space-x-3 flex-wrap">
                                            <h4 className="font-bold text-gray-900">{c.firstName} {c.lastName}</h4>
                                            {mpVis.matchPercent ? (
                                               <span className={`px-2 py-0.5 rounded text-xs font-bold ${percent > 70 ? 'bg-green-100 text-green-800' : 'bg-gray-100 text-gray-800'}`}>{percent}% (guide)</span>
                                            ) : null}
                                         </div>
                                         {mpVis.matchReasons ? (
                                         <div className="text-xs text-gray-500 mt-1 flex gap-2 flex-wrap">
                                            {reasons.slice(0, 3).map((r,i) => <span key={i} className="bg-gray-100 px-1 rounded">{r}</span>)}
                                         </div>
                                         ) : null}
                                     </div>
                                     <button
                                       type="button"
                                       disabled={savingMatch}
                                       onClick={(e) => { e.stopPropagation(); togglePendingMatchTarget(c.id); }}
                                       className={`flex-shrink-0 px-4 py-2 rounded text-sm font-medium border-2 transition disabled:opacity-50 disabled:pointer-events-none ${
                                          isPending
                                             ? 'border-brand-600 bg-brand-50 text-brand-800'
                                             : 'border-gray-300 bg-white text-gray-700 hover:border-brand-400 hover:bg-brand-50/50'
                                       }`}
                                     >{isPending ? 'Added' : 'Add'}</button>
                                  </div>
                                  );
                               })}
                               {findMatchCandidates.length === 0 && (
                                  <p className="text-center text-gray-500 text-sm py-8">No one matches that filter. Clear the search box to see everyone.</p>
                               )}
                            </div>
                         </div>
                      )}
                   </div>
                </div>
             </div>
             );
          })()}
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
